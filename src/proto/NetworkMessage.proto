syntax = "proto3";

// 消息类型枚举
enum MessageType {
    HEARTBEAT = 0;
    CONNECT = 1;
    START_MATCH = 2;
    GAME_START = 3;
    BATTLE_PREP_TIMER = 4;
    BATTLE_PREP_SNAPSHOT = 5;
    ALL_SNAPSHOTS = 6;
    BATTLE_RESULT = 7;
    SETTLEMENT = 8;
}

// 心跳消息
message HeartbeatMessage {
}

// 建立连接消息（客户端→服务器）
message ConnectRequestMessage {
}

// 自定义数据类型：玩家基础信息
message PlayerBasicInfo {
    string player_id = 1;
    string player_name = 2;
    int32 icon_id = 3;
}

// 对局开始广播（服务器→所有客户端）
message GameStartMessage {
    string match_id = 1;
    repeated PlayerBasicInfo players_info = 2;
}

// 备战倒计时广播（服务器→客户端）
message BattlePrepTimerMessage {
    string match_id = 1;
    int32 round = 2;
    int32 remaining_time_seconds = 3;
}

// 客户端提交的备战快照信息（客户端→服务器）
message BattlePrepSnapshotMessage {
    string match_id = 1;
    int32 round = 2;
    string formation_data = 3; // 阵容数据
    int32 honor_value = 4;
}

// 自定义数据类型：单个玩家快照
message PlayerSnapshot {
    string player_id = 1;
    string match_id = 2;
    int32 round = 3;
    string formation_data = 4; // 需与上方formation_data结构一致
    int32 honor_value = 5;
}

// 所有玩家快照广播（服务器→所有客户端）
message AllSnapshotsMessage {
    string match_id = 1;
    int32 round = 2;
    repeated PlayerSnapshot snapshots = 3;  // 所有玩家的快照
    int32 seed = 4; // 随机数种子，C#客户端Random(seed)调用
}

// 战斗结果上报（客户端→服务器）
message BattleResultReportMessage {
    string match_id = 1;
    int32 round = 2;
    int32 honor_value = 3;
}

// 自定义数据类型：排名条目
message RankingEntry {
    string player_id = 1;
    int32 honor_value = 2;
    int32 rank = 3;
}

// 结算信息广播（服务器→所有客户端）
message SettlementMessage {
    string match_id = 1;
    repeated RankingEntry rankings = 2;
}

// 基础消息结构
message NetworkMessage {
    MessageType msg_id = 1;
    string player_id = 2;

    oneof data{
        HeartbeatMessage heartbeat = 5;
        ConnectRequestMessage connect_request = 6;
        GameStartMessage game_start = 7;
        BattlePrepTimerMessage battle_prep_timer = 8;
        BattlePrepSnapshotMessage battle_prep_snapshot = 9;
        AllSnapshotsMessage all_snapshots = 10;
        BattleResultReportMessage battle_result_report = 11;
        SettlementMessage settlement = 12;
    }
}