syntax = "proto3";

// 消息类型枚举
enum MessageType {
    HEARTBEAT = 0;              // 心跳消息
    CONNECT = 1;                // 连接
    START_MATCH = 2;            // 匹配请求
    GAME_START = 3;             // 对局开始
    WAITING_PLAYER = 4;         // 等待的玩家数量 20250730updated
    DATA_LOADED = 5;            // 数据加载完成 20250728updated
    PREPARE_START = 6;          // 备战开始 20250728updated
    BATTLE_PREP_TIMER = 7;      // 备战倒计时
    BATTLE_PREP_SNAPSHOT = 8;   // 备战快照
    ALL_SNAPSHOTS = 9;          // 所有玩家快照
    BATTLE_RESULT = 10;          // 战斗结果上报
    SETTLEMENT = 11;            // 结算信息
    EXIT = 12;                  // 玩家退出房间 20250728updated
    DISCONNECTED = 13;          // 玩家断线 20250728updated
}

// 心跳消息
message HeartbeatMessage {
}

// 建立连接消息（客户端→服务器）
message ConnectRequestMessage {
}

// 20250730updated
// 等待队列消息（服务器→所有在等待队列的客户端）
message WaitingPlayerMessage {
    int32 waiting_player_count = 1;
    int32 room_capacity = 2;
}

// 自定义数据类型：玩家基础信息
message PlayerBasicInfo {
    string player_id = 1;
    string player_name = 2;
    int32 icon_id = 3;
}

// 20250730updated
// 发起匹配消息（客户端→服务器）
message StartMatchMessage {
    PlayerBasicInfo player_info = 1; // 发起匹配的玩家信息
}

// 对局开始广播（服务器→所有客户端）
message GameStartMessage {
    string match_id = 1;
    int32 total_rounds = 2; // 总回合数 20250730updated
    repeated PlayerBasicInfo players_info = 3;
}

// 20250728updated
// 数据加载完成消息（客户端→服务器）
message DataLoadedMessage {
}

// 20250728updated
// 备战开始消息（服务器→所有客户端）
message BattlePrepStartMessage {
    int32 prepare_time_seconds = 1; // 备战时间（秒）
}

// 备战倒计时广播（服务器→客户端）
message BattlePrepTimerMessage {
    string match_id = 1;
    int32 round = 2;
    int32 remaining_time_seconds = 3;
}

// 客户端提交的备战快照信息（客户端→服务器）
message BattlePrepSnapshotMessage {
    string match_id = 1;
    int32 round = 2;
    string formation_data = 3; // 阵容数据
    int32 honor_value = 4;
}

// 自定义数据类型：单个玩家快照
message PlayerSnapshot {
    string player_id = 1;
    string match_id = 2;
    int32 round = 3;
    string formation_data = 4; // 需与上方formation_data结构一致
    int32 honor_value = 5;
}

// 所有玩家快照广播（服务器→所有客户端）
message AllSnapshotsMessage {
    string match_id = 1;
    int32 round = 2;
    string first_player_id = 3; // 首发玩家ID
    repeated PlayerSnapshot snapshots = 4;  // 所有玩家的快照
    int32 seed = 5; // 随机数种子，C#客户端Random(seed)调用
}

// 战斗结果上报（客户端→服务器）
message BattleResultReportMessage {
    string match_id = 1;
    int32 round = 2;
    int32 honor_value = 3;
}

// 自定义数据类型：排名条目
message RankingEntry {
    string player_id = 1;
    int32 honor_value = 2;
    int32 rank = 3;
}

// 结算信息广播（服务器→所有客户端）
message SettlementMessage {
    string match_id = 1;
    repeated RankingEntry rankings = 2;
}

// 20250728updated
// 自定义数据类型：退出玩家信息
message ExitPlayerInfo {
    string exit_player_id = 1;
    int32 exit_round = 2;
    int32 exit_honor_value = 3; // 退出时的荣耀值
}

// 退出房间消息（客户端→服务器）
message ExitMessage {
    ExitPlayerInfo exit_info = 1;
}

// 广播退出/断线消息（服务器→所有在线客户端）
message ExitBroadcastMessage {
    repeated ExitPlayerInfo exit_players_info = 1;
}

// 基础消息结构
message NetworkMessage {
    MessageType msg_id = 1;
    string player_id = 2;

    oneof data{
        HeartbeatMessage heartbeat = 5;
        ConnectRequestMessage connect_request = 6;
        StartMatchMessage start_match = 7;
        WaitingPlayerMessage waiting_player = 8;
        GameStartMessage game_start = 9;
        DataLoadedMessage data_loaded = 10;
        BattlePrepStartMessage battle_prep_start = 11;
        BattlePrepTimerMessage battle_prep_timer = 12;
        BattlePrepSnapshotMessage battle_prep_snapshot = 13;
        AllSnapshotsMessage all_snapshots = 14;
        BattleResultReportMessage battle_result_report = 15;
        SettlementMessage settlement = 16;
        ExitMessage exit = 17;
        ExitBroadcastMessage exit_broadcast = 18;
    }
}